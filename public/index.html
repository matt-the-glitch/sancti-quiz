<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sancti – Heilige in der Kunst erkennen</title>
<link rel="preconnect" href="https://commons.wikimedia.org">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,500&family=Alegreya+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c49a2a;
  --gold-light: #ddb44e;
  --gold-pale: #e8d5a8;
  --ink: #111a2e;
  --ink-light: #182440;
  --parchment: #e8e0d0;
  --parchment-dark: #ebe0cf;
  --red-oxide: #cf4433;
  --blue-dark: #1c3150;
  --green: #2d5a27;
  --correct: #3a8a34;
  --wrong: #cf4433;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--ink)}
body{
  font-family:'Alegreya Sans',sans-serif;
  background:var(--ink);
  color:var(--parchment);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
}
.screen{display:none;width:100%;max-width:560px;padding:1rem;flex-direction:column;align-items:center;background:var(--ink);min-height:100vh}
.screen.active{display:flex}

#startScreen{justify-content:center;min-height:100vh;text-align:center}
.logo-cross{font-size:2.8rem;color:var(--gold);opacity:.5;margin-bottom:.6rem}
.logo-title{
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:clamp(2.4rem,7vw,3.6rem);
  color:var(--gold-light);letter-spacing:.06em;
  line-height:1.1;margin-bottom:.3rem;
}
.logo-subtitle{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:1.05rem;color:var(--gold-pale);opacity:1;
  margin-bottom:2rem;
}
.name-input{
  font-family:'Cormorant Garamond',serif;
  font-size:1.3rem;text-align:center;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(196,154,42,.45);
  border-radius:3px;color:#ede5d6;
  padding:.7rem 1.2rem;width:100%;max-width:300px;
  outline:none;margin-bottom:1rem;
  transition:border-color .2s;
}
.name-input::placeholder{color:rgba(236,228,212,.4)}
.name-input:focus{border-color:var(--gold)}
.start-btn{
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase;
  background:var(--gold);color:var(--ink);
  border:none;border-radius:3px;
  padding:.75rem 2.5rem;cursor:pointer;
  transition:all .2s;
}
.start-btn:hover{background:var(--gold-light);transform:translateY(-1px)}
.start-btn:disabled{opacity:.4;cursor:default;transform:none}

#gameScreen{min-height:100vh;padding-top:.8rem;padding-bottom:1.5rem}
.hud{
  display:flex;justify-content:space-between;align-items:center;
  width:100%;margin-bottom:.8rem;
  font-size:.85rem;color:var(--gold-pale);
}
.hud-score{
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:1.5rem;color:var(--gold-light);text-align:right;
}
.hud-question{
  font-family:'Cormorant Garamond',serif;
  font-size:.9rem;opacity:.85;
}
.question-type-badge{
  display:inline-block;
  font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;
  background:rgba(196,154,42,.25);
  color:#ddb44e;
  padding:.2rem .6rem;border-radius:2px;
  margin-bottom:.6rem;
}
.image-frame{
  width:100%;
  max-height:380px;
  border:2px solid rgba(196,154,42,.35);
  border-radius:3px;
  overflow:hidden;
  margin-bottom:.8rem;
  background:rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  min-height:200px;
}
.image-frame img{
  width:100%;height:100%;
  max-height:380px;
  object-fit:contain;
  display:block;
}
.image-frame .img-loading{
  color:var(--gold-pale);opacity:.7;
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:1rem;
}
.question-text{
  font-family:'Cormorant Garamond',serif;
  font-size:1.2rem;font-weight:600;
  text-align:center;
  color:#ffffff;
  margin-bottom:1rem;
  line-height:1.4;
}
.options{
  display:grid;grid-template-columns:1fr 1fr;
  gap:.6rem;width:100%;
}
.option-btn{
  font-family:'Alegreya Sans',sans-serif;
  font-size:.95rem;font-weight:500;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(196,154,42,.45);
  border-radius:3px;
  color:#e8e0d0;
  padding:.8rem .6rem;
  cursor:pointer;
  transition:all .15s;
  text-align:center;
  line-height:1.3;
}
.option-btn:hover:not(:disabled){
  background:rgba(196,154,42,.15);
  border-color:var(--gold-light);
}
.option-btn:disabled{cursor:default}
.option-btn.correct{
  background:rgba(45,90,39,.4);
  border-color:var(--correct);
  color:#c8eec0;
}
.option-btn.wrong{
  background:rgba(139,37,0,.35);
  border-color:var(--wrong);
  color:#f0bfb0;
}
.artwork-info{
  font-family:'Cormorant Garamond',serif;
  font-size:.85rem;font-style:italic;
  color:var(--gold-pale);opacity:.85;
  text-align:center;
  margin-top:.6rem;
  min-height:1.2rem;
}
.next-area{
  margin-top:.8rem;
  text-align:center;
}
.next-btn{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;font-size:1rem;
  letter-spacing:.06em;text-transform:uppercase;
  background:var(--gold);color:var(--ink);
  border:none;border-radius:3px;
  padding:.6rem 2rem;cursor:pointer;
  display:none;
}
.next-btn:hover{background:var(--gold-light)}

#endScreen{justify-content:center;min-height:100vh;text-align:center}
.end-cross{font-size:2rem;color:var(--red-oxide);opacity:.5;margin-bottom:.5rem}
.end-title{
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:2rem;color:var(--parchment);margin-bottom:.3rem;
}
.end-score{
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:3rem;color:var(--gold-light);margin-bottom:.2rem;
}
.end-score-label{
  font-size:.85rem;color:var(--gold-pale);opacity:.8;
  margin-bottom:.3rem;
}
.end-detail{
  font-size:.9rem;color:var(--gold-pale);opacity:.85;
  margin-bottom:1.5rem;
}
.leaderboard{
  width:100%;max-width:360px;
  margin-bottom:1.5rem;
}
.lb-title{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;font-size:1.1rem;
  color:var(--gold);margin-bottom:.6rem;
  text-transform:uppercase;letter-spacing:.08em;
}
.lb-row{
  display:flex;justify-content:space-between;
  padding:.35rem .6rem;
  font-size:.9rem;
  border-bottom:1px solid rgba(196,154,42,.15);
}
.lb-row.highlight{
  background:rgba(196,154,42,.15);
  border-radius:2px;
  color:var(--gold-light);
  font-weight:500;
}
.lb-rank{width:2rem;text-align:center;color:var(--gold);opacity:.85}
.lb-name{flex:1;text-align:left;padding-left:.5rem}
.lb-pts{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--gold-light)}
.play-again-btn{
  font-family:'Cormorant Garamond',serif;font-weight:700;
  font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;
  background:var(--gold);color:var(--ink);
  border:none;border-radius:3px;
  padding:.7rem 2.2rem;cursor:pointer;
}
.play-again-btn:hover{background:var(--gold-light)}

.footer-note{
  font-size:.72rem;color:rgba(236,228,212,.45);
  margin-top:1.5rem;text-align:center;
}
.footer-note a{color:rgba(236,228,212,.55)}

.hud-lives{
  font-size:1.3rem;
  color:var(--wrong);
  letter-spacing:.15em;
}
.hud-score-label{
  font-size:.72rem;
  color:var(--gold);
  opacity:.7;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.feedback-area{
  width:100%;
  margin-top:.8rem;
  text-align:center;
}
.feedback-label{
  font-family:'Cormorant Garamond',serif;
  font-weight:600;
  font-size:1.05rem;
  color:var(--gold-light);
  margin-bottom:.5rem;
}
.feedback-frame{
  max-height:280px;
  margin-bottom:.4rem;
}
.feedback-frame img{
  max-height:280px;
}
.feedback-info{
  font-family:'Cormorant Garamond',serif;
  font-size:.82rem;
  font-style:italic;
  color:var(--gold-pale);
  opacity:.8;
}
</style>
</head>
<body>

<div class="screen active" id="startScreen">
  <div class="logo-cross">✦</div>
  <div class="logo-title">Sancti</div>
  <div class="logo-subtitle">Erkenne die Heiligen in der Kunst</div>
  <input class="name-input" id="nameInput" type="text" placeholder="Dein Name" maxlength="20" autocomplete="off">
  <button class="start-btn" id="startBtn" disabled onclick="startGame()">Quiz starten</button>
  <p class="footer-note" style="margin-top:2rem;">Du hast 3 Leben – wie weit kommst du?<br>Bilder via <a href="https://commons.wikimedia.org" target="_blank">Wikimedia Commons</a></p>
</div>

<div class="screen" id="gameScreen">
  <div class="hud">
    <div><span class="hud-question" id="hudQ">Frage 1</span></div>
    <div class="hud-lives" id="hudLives">♥ ♥ ♥</div>
    <div style="text-align:right"><div class="hud-score" id="hudScore">0</div><div class="hud-score-label">richtig</div></div>
  </div>
  <div class="question-type-badge" id="qTypeBadge"></div>
  <div class="image-frame" id="imageFrame" style="display:none">
    <span class="img-loading" id="imgLoading">Bild wird geladen…</span>
    <img id="quizImage" alt="Gemälde" referrerpolicy="no-referrer" onload="this.style.display='block';document.getElementById('imgLoading').style.display='none'" onerror="handleImageError(this)" style="display:none">
  </div>
  <div class="question-text" id="questionText"></div>
  <div class="options" id="optionsGrid"></div>
  <div class="artwork-info" id="artworkInfo"></div>
  <div class="feedback-area" id="feedbackArea" style="display:none">
    <div class="feedback-label" id="feedbackLabel"></div>
    <div class="image-frame feedback-frame">
      <span class="img-loading" id="fbImgLoading">Bild wird geladen…</span>
      <img id="feedbackImage" alt="Heiliger" referrerpolicy="no-referrer" onload="this.style.display='block';document.getElementById('fbImgLoading').style.display='none'" onerror="document.getElementById('fbImgLoading').textContent=''" style="display:none">
    </div>
    <div class="feedback-info" id="feedbackInfo"></div>
  </div>
  <div class="next-area"><button class="next-btn" id="nextBtn" onclick="nextQuestion()">Weiter</button></div>
</div>

<div class="screen" id="endScreen">
  <div class="end-cross">✦</div>
  <div class="end-title">Spiel vorbei</div>
  <div class="end-score" id="endScore">0</div>
  <div class="end-score-label">richtige Antworten</div>
  <div class="end-detail" id="endDetail"></div>
  <div class="leaderboard" id="leaderboard">
    <div class="lb-title">Bestenliste</div>
    <div id="lbRows"></div>
  </div>
  <button class="play-again-btn" onclick="resetGame()">Nochmal spielen</button>
  <p class="footer-note">Bilder via <a href="https://commons.wikimedia.org" target="_blank">Wikimedia Commons</a></p>
</div>

let playerName = '';
let score = 0;
let lives = 3;
let questionNum = 0;
let usedQuestions = new Set();
let answered = false;

const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');
nameInput.addEventListener('input', () => {
  startBtn.disabled = nameInput.value.trim().length === 0;
});
nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && nameInput.value.trim()) startGame();
});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame() {
  playerName = nameInput.value.trim();
  if (!playerName) return;
  score = 0; lives = 3; questionNum = 0;
  usedQuestions.clear();
  showScreen('gameScreen');
  nextQuestion();
}

function renderLives() {
  const full = '♥ '.repeat(lives).trim();
  const empty = '♡ '.repeat(3 - lives).trim();
  document.getElementById('hudLives').innerHTML =
    `<span style="color:var(--wrong)">${full}</span>` +
    (empty ? ` <span style="opacity:.3">${empty}</span>` : '');
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

const KNOWN_SINGLE_ARTISTS = new Set([
  'caravaggio','tizian','titian','tintoretto','donatello','raffael','raphael',
  'michelangelo','leonardo','pisanello','parmigianino','pontormo','bronzino',
  'correggio','giorgione','mantegna','masaccio','perugino','sodoma','crivelli',
  'memling','botticelli','duccio','cimabue','giotto','rembrandt','rubens',
  'goya','holbein','dürer','grünewald','guercino','domenichino','reni',
  'murillo','pacher','altdorfer','schongauer','velázquez','velazquez',
  'zurbarán','zurbaran'
]);
function isRealArtist(name) {
  if (!name) return false;
  const n = name.trim();
  if (n.length < 3 || /^\d/.test(n)) return false;
  const nl = n.toLowerCase();
  if (nl === 'unbekannt' || nl.startsWith('anonymous') || nl.startsWith('unknown')) return false;
  if (/\b\d+(st|nd|rd|th)?[-\s]+century/i.test(n)) return false;
  const buildings = ['pfarrkirche','kathedrale','cathedral','monastery','museum',
    'collection','chapel','altarpiece','fondazione','pinakothek','gallery',
    'galerie','university','basilica','klosterkirche','frauenkirche'];
  if (buildings.some(b => nl.includes(b))) return false;
  if (n[0] !== n[0].toUpperCase()) return false;
  if (!n.includes(' ') && !n.includes(',') && !n.includes('-')) {
    return KNOWN_SINGLE_ARTISTS.has(nl);
  }
  return true;
}

function handleImageError(img) {
  document.getElementById('imgLoading').textContent = 'Bild konnte nicht geladen werden';
  document.getElementById('imgLoading').style.display = '';
  img.style.display = 'none';
}

function getWrongSaints(correctSaint, count) {
  const names = [...new Set(SAINTS_DATA.map(s => s.saint))].filter(n => n !== correctSaint);
  return shuffleArray(names).slice(0, count);
}

function getWrongSaintsWithoutAttr(attr, correctSaint, count) {
  const names = [...new Set(
    SAINTS_DATA
      .filter(s => s.saint !== correctSaint && !s.attributes.includes(attr))
      .map(s => s.saint)
  )];
  return shuffleArray(names).slice(0, count);
}

function getWrongAttributes(correctAttrs, count) {
  const allAttrs = new Set();
  SAINTS_DATA.forEach(s => s.attributes.forEach(a => allAttrs.add(a)));
  correctAttrs.forEach(a => allAttrs.delete(a));
  return shuffleArray([...allAttrs]).slice(0, count);
}

function generateQuestion() {
  let maxDiff = 1;
  if (score >= 5) maxDiff = 2;
  if (score >= 10) maxDiff = 3;

  const questionTypes = ['image_saint', 'attr_to_saint', 'saint_to_attr', 'image_artist'];
  let pool = SAINTS_DATA.filter(s => s.difficulty <= maxDiff);
  if (pool.length < 4) pool = SAINTS_DATA;

  let attempts = 0;

  while (attempts < 50) {
    attempts++;
    const type = pickRandom(questionTypes);
    const saint = pickRandom(pool);

    if (type === 'image_saint' || type === 'image_artist') {
      if (!saint.paintings || saint.paintings.length === 0) continue;
      // Bei image_artist nur paintings mit echtem Kuenstler
      const usable = type === 'image_artist'
        ? saint.paintings.filter(p => isRealArtist(p.artist))
        : saint.paintings;
      if (usable.length === 0) continue;
      const painting = pickRandom(usable);
      const qKey = type + ':' + painting.img;
      if (usedQuestions.has(qKey)) continue;
      usedQuestions.add(qKey);

      const infoParts = [];
      if (isRealArtist(painting.artist)) infoParts.push(painting.artist + ' – ' + painting.title);
      else infoParts.push(painting.title);
      if (painting.year) infoParts.push(painting.year);
      if (painting.museum) infoParts.push(painting.museum);
      const infoText = infoParts.filter(Boolean).join(' · ');

      if (type === 'image_saint') {
        const wrongs = getWrongSaints(saint.saint, 3);
        const options = shuffleArray([saint.saint, ...wrongs]);
        return {
          type: 'Bild-Frage',
          image: painting.img,
          text: 'Welcher Heilige ist hier dargestellt?',
          options, answer: saint.saint,
          saintName: saint.saint,
          shownImg: painting.img,
          info: infoText
        };
      } else {
        // image_artist: nur echte Kuenstler als wrongs
        const allArtists = new Set();
        SAINTS_DATA.forEach(s => (s.paintings || []).forEach(p => {
          if (isRealArtist(p.artist)) allArtists.add(p.artist);
        }));
        allArtists.delete(painting.artist);
        if (allArtists.size < 3) continue;
        const wrongArtists = shuffleArray([...allArtists]).slice(0, 3);
        const options = shuffleArray([painting.artist, ...wrongArtists]);
        return {
          type: 'Künstler-Frage',
          image: painting.img,
          text: 'Wer hat dieses Werk geschaffen?',
          options, answer: painting.artist,
          saintName: saint.saint,
          shownImg: painting.img,
          info: [painting.title + ' (' + saint.saint + ')', painting.year, painting.museum].filter(Boolean).join(' · ')
        };
      }
    }

    if (type === 'attr_to_saint') {
      const attr = pickRandom(saint.attributes);
      const qKey = 'a2s:' + attr;
      if (usedQuestions.has(qKey)) continue;
      const wrongs = getWrongSaintsWithoutAttr(attr, saint.saint, 3);
      if (wrongs.length < 3) continue;
      usedQuestions.add(qKey);
      const options = shuffleArray([saint.saint, ...wrongs]);
      return {
        type: 'Attribut-Frage',
        image: null,
        text: `Welcher Heilige wird mit „${attr}" dargestellt?`,
        options, answer: saint.saint,
        saintName: saint.saint,
        info: `${saint.saint} – Attribute: ${saint.attributes.join(', ')}`
      };
    }

    if (type === 'saint_to_attr') {
      const correctAttr = pickRandom(saint.attributes);
      const qKey = 's2a:' + saint.saint + ':' + correctAttr;
      if (usedQuestions.has(qKey)) continue;
      usedQuestions.add(qKey);
      const wrongAttrs = getWrongAttributes(saint.attributes, 3);
      const options = shuffleArray([correctAttr, ...wrongAttrs]);
      return {
        type: 'Zuordnungs-Frage',
        image: null,
        text: `Welches Attribut gehört zu ${saint.saint}?`,
        options, answer: correctAttr,
        saintName: saint.saint,
        info: `${saint.saint} – Attribute: ${saint.attributes.join(', ')}`
      };
    }
  }

  const saint = pickRandom(SAINTS_DATA);
  const attr = pickRandom(saint.attributes);
  const wrongs = getWrongSaintsWithoutAttr(attr, saint.saint, 3);
  return {
    type: 'Attribut-Frage',
    image: null,
    text: `Welcher Heilige wird mit „${attr}" dargestellt?`,
    options: shuffleArray([saint.saint, ...wrongs]),
    answer: saint.saint,
    saintName: saint.saint,
    info: `${saint.saint} – Attribute: ${saint.attributes.join(', ')}`
  };
}

function nextQuestion() {
  answered = false;
  questionNum++;
  const q = generateQuestion();

  document.getElementById('hudQ').textContent = `Frage ${questionNum}`;
  document.getElementById('hudScore').textContent = score;
  renderLives();
  document.getElementById('qTypeBadge').textContent = q.type;
  document.getElementById('questionText').textContent = q.text;
  document.getElementById('artworkInfo').textContent = '';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('feedbackArea').style.display = 'none';

  const frame = document.getElementById('imageFrame');
  const img = document.getElementById('quizImage');
  const loading = document.getElementById('imgLoading');
  if (q.image) {
    frame.style.display = 'flex';
    img.style.display = 'none';
    loading.style.display = '';
    loading.textContent = 'Bild wird geladen…';
    img.src = q.image;
  } else {
    frame.style.display = 'none';
    img.src = '';
  }

  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => handleAnswer(btn, opt, q);
    grid.appendChild(btn);
  });
}

function handleAnswer(btn, chosen, q) {
  if (answered) return;
  answered = true;
  const correct = chosen === q.answer;

  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.answer) b.classList.add('correct');
    if (b === btn && !correct) b.classList.add('wrong');
  });

  document.getElementById('artworkInfo').textContent = q.info;

  if (correct) {
    score++;
    document.getElementById('hudScore').textContent = score;
  } else {
    lives--;
    renderLives();
  }

  showFeedbackImage(q, correct);

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'inline-block';
  if (lives > 0) {
    nextBtn.textContent = correct ? 'Weiter' : `Weiter (noch ${lives} Leben)`;
    nextBtn.onclick = nextQuestion;
  } else {
    nextBtn.textContent = 'Zur Bestenliste';
    nextBtn.onclick = endGame;
  }
}

function showFeedbackImage(q, wasCorrect) {
  const entry = SAINTS_DATA.find(s => s.saint === q.saintName);
  let feedbackPainting = null;
  const feedbackSaint = entry ? entry.saint : '';

  if (entry && entry.paintings && entry.paintings.length > 0) {
    const others = entry.paintings.filter(p => p.img !== q.shownImg);
    feedbackPainting = others.length > 0
      ? others[Math.floor(Math.random() * others.length)]
      : entry.paintings[0];
  }

  const area = document.getElementById('feedbackArea');
  const label = document.getElementById('feedbackLabel');
  const img = document.getElementById('feedbackImage');
  const loading = document.getElementById('fbImgLoading');
  const info = document.getElementById('feedbackInfo');

  if (feedbackPainting) {
    label.textContent = wasCorrect
      ? `Richtig! – ${feedbackSaint}`
      : `Falsch – Die richtige Antwort: ${q.answer}`;
    label.style.color = wasCorrect ? 'var(--correct)' : 'var(--wrong)';
    img.style.display = 'none';
    loading.style.display = '';
    loading.textContent = 'Bild wird geladen…';
    img.src = feedbackPainting.img;
    const _fbHead = isRealArtist(feedbackPainting.artist)
      ? feedbackPainting.artist + ' – ' + feedbackPainting.title
      : feedbackPainting.title;
    info.textContent = [_fbHead, feedbackPainting.year].filter(Boolean).join(', ');
    area.style.display = 'block';
  } else {
    label.textContent = wasCorrect
      ? `Richtig! – ${q.answer}`
      : `Falsch – Die richtige Antwort: ${q.answer}`;
    label.style.color = wasCorrect ? 'var(--correct)' : 'var(--wrong)';
    img.style.display = 'none';
    loading.style.display = 'none';
    info.textContent = '';
    area.style.display = 'block';
  }
}

function endGame() {
  document.getElementById('endScore').textContent = score;
  document.getElementById('endDetail').textContent = `${score} von ${questionNum} Fragen richtig beantwortet`;
  saveScore(playerName, score, questionNum);
  renderLeaderboard();
  showScreen('endScreen');
}

function resetGame() {
  showScreen('startScreen');
  nameInput.value = playerName;
  startBtn.disabled = false;
}

function saveScore(name, pts, total) {
  try {
    const key = 'sancti-leaderboard';
    let lb = JSON.parse(localStorage.getItem(key) || '[]');
    lb.push({ name, score: pts, total, date: new Date().toISOString().slice(0, 10) });
    lb.sort((a, b) => b.score - a.score);
    localStorage.setItem(key, JSON.stringify(lb.slice(0, 50)));
  } catch(e) {}
}

function renderLeaderboard() {
  const container = document.getElementById('lbRows');
  let lb = [];
  try { lb = JSON.parse(localStorage.getItem('sancti-leaderboard') || '[]'); } catch(e) {}

  if (lb.length === 0) {
    container.innerHTML = '<div style="opacity:.4;font-size:.85rem;padding:.5rem">Noch keine Einträge</div>';
    return;
  }

  container.innerHTML = lb.slice(0, 10).map((entry, i) => {
    const isMe = entry.name === playerName && entry.score === score;
    return `<div class="lb-row ${isMe ? 'highlight' : ''}">
      <span class="lb-rank">${i + 1}</span>
      <span class="lb-name">${escHtml(entry.name)}</span>
      <span class="lb-pts">${entry.score}</span>
    </div>`;
  }).join('');
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
